<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cadastro de Inscrição</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #5b6578;
      --line: #d9e0ea;
      --accent: #2446f0;
      --accent-2: #0f8b8d;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #eef2ff 0%, var(--bg) 40%, #f8fafc 100%);
      color: var(--text);
    }
    main {
      max-width: 880px;
      margin: 40px auto;
      padding: 24px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.15;
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
    }
    form {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    label {
      display: grid;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
    }
    .full { grid-column: 1 / -1; }
    input, select, textarea, button {
      font: inherit;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      background: #fff;
      color: var(--text);
    }
    textarea { min-height: 110px; resize: vertical; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: .7; cursor: wait; }
    .secondary {
      background: #e8ecff;
      color: var(--accent);
    }
    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
      grid-column: 1 / -1;
      flex-wrap: wrap;
    }
    pre {
      margin: 18px 0 0;
      padding: 16px;
      background: #0f172a;
      color: #dbeafe;
      border-radius: 12px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .hint {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
    }
    .error { color: var(--danger); }
    @media (max-width: 720px) {
      form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h1>Cadastro para triagem</h1>
      <p>Envie os dados para o webhook do n8n. O CNPJ e obrigatório.</p>

      <form id="cadastro-form">
        <label class="full">
          URL do webhook
          <input id="webhook-url" name="webhookUrl" type="url" placeholder="https://seu-tunnel/webhook/triagem-cnpj" required>
        </label>

        <label>
          CNPJ
          <input name="cnpj" placeholder="00.000.000/0000-00" required>
        </label>

        <label>
          Nome
          <input name="nome" placeholder="Nome da empresa ou responsável" required>
        </label>

        <label>
          E-mail
          <input name="email" type="email" placeholder="contato@empresa.com" required>
        </label>

        <label>
          Cidade
          <input name="cidade" placeholder="Cidade" required>
        </label>

        <label>
          Tipo de participação
          <select name="tipoParticipacao" required>
            <option value="empresa">Empresa</option>
            <option value="comunidade">Comunidade</option>
            <option value="parceiro">Parceiro</option>
          </select>
        </label>

        <label class="full">
          Observações
          <textarea name="observacoes" placeholder="Conte um pouco sobre a solicitação"></textarea>
        </label>

        <div class="actions">
          <button type="submit">Enviar cadastro</button>
          <button class="secondary" type="button" id="preencher-exemplo">Preencher exemplo</button>
        </div>
      </form>

      <div class="hint">Depois de publicar o webhook com Cloudflare Tunnel ou ngrok, cole a URL acima e faça o envio de teste.</div>
      <pre id="resultado">Aguardando envio...</pre>
    </section>
  </main>

  <script>
    const form = document.querySelector('#cadastro-form');
    const result = document.querySelector('#resultado');
    const webhookInput = document.querySelector('#webhook-url');

    document.querySelector('#preencher-exemplo').addEventListener('click', () => {
      form.nome.value = 'Wideck Tecnologia Ltda';
      form.cnpj.value = '12.345.678/0001-95';
      form.email.value = 'contato@wideck.com.br';
      form.cidade.value = 'Ponta Grossa';
      form.tipoParticipacao.value = 'empresa';
      form.observacoes.value = 'Cadastro de teste para a trilha de automação.';
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      result.classList.remove('error');
      result.textContent = 'Enviando...';

      const webhookUrl = webhookInput.value.trim();
      const payload = Object.fromEntries(new FormData(form).entries());
      delete payload.webhookUrl;

      try {
        const response = await fetch(webhookUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const text = await response.text();
        result.textContent = `Status: ${response.status}\n\n${text}`;
        if (!response.ok) result.classList.add('error');
      } catch (error) {
        result.classList.add('error');
        result.textContent = `Erro ao enviar: ${error.message}`;
      }
    });
  </script>
</body>
</html>
